</head>
<body>


<section>
    <div class="container card-backgrond">
        <div class="card11-page card-page">

                <div class="mt-3">
                  <h2 class="fw-bold">Mei Wang</h2>
                  <h5 class="p-0 m-0 fw-bold">Computer Programmer</h5>
                </div>
                <div class="pt-4">
                    <a href="#"><i class="fa-brands fa-whatsapp text-dark bg-white fs-4 p-2 rounded-5"></i></a>

 <script>
	document.addEventListener("DOMContentLoaded", function () {
		const navbar = document.querySelector(".navbar-custom");

		window.addEventListener("scroll", function () {
			if (window.scrollY > 50) {
				navbar.classList.add("scrolled");
			} else {
				navbar.classList.remove("scrolled");
			}
		});
	});
	</script>	
	

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
