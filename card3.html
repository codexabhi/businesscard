<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link href="assetes/css/style.css" rel="stylesheet">
</head>
<body>


<section>
    <div class="container card-backgrond">
        <div class="card3-page card-page">
            <div class="card-text-align text-center">
                <div class="card-3-logo">
                  <img src="assetes/image/card-3/logo.png" class="img-fluid pt-4" width="70%">
                </div>
                <div class="">
                  <h2 class="p-0 m-0">Your Bussiness Nsme</h2>
                  <p>#1 Platform For Digital Bussiness</p>
                  <hr>
                </div>
                <i class="fa-solid fa-globe bg-primary fa-card-3"></i>
                <p>Mobile Number</p>
                <div class="card-3-icon">
                  <div>
                    <i class="fa-solid fa-envelope bg-primary fa-card-3"></i>
                    <p>Email</p>
                  </div>
                  <div>
                    <i class="fa-solid fa-location-dot bg-primary fa-card-3"></i>
                    <p>Location</p>
                  </div>
                </div>
                <div class="pt-3">
                  <h4>CONTACT WITH US</h4>
                  <a href="#"><i class="fa-brands fa-facebook-f bg-primary fa-card-3"></i></a>

                  <a href="#"><i class="fa-brands fa-youtube bg-danger fa-card-3"></i></a>
                  <a href="#"><i class="fa-brands fa-linkedin-in bg-primary fa-card-3"></i></a>

                </div>
                <div class="card-3-footer">

                  <i class="fa-brands fa-whatsapp bg-success fa-card-3"></i>

    </div>
</section>

 <script>
	document.addEventListener("DOMContentLoaded", function () {
		const navbar = document.querySelector(".navbar-custom");

		window.addEventListener("scroll", function () {
			if (window.scrollY > 50) {
				navbar.classList.add("scrolled");
			} else {
				navbar.classList.remove("scrolled");
			}
		});
	});
	</script>	
	

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
