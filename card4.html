<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link href="assetes/css/style.css" rel="stylesheet">
</head>
<body>


<section>
    <div class="container card-backgrond">
        <div class="card4-page card-page">
            <div class="card-text-align text-center">
                <div class="my-3 my-md-2">
                  <img src="assetes/image/card-4/card-4-logo.png" class="img-fluid pt-4" width="40%">
                </div>
                <div class="card-4-img">
                  <img src="assetes/image/card-4/card-4-founder.jpg">
                </div>
                <div class="pt-2">
                    <h4 class="fw-bold m-0 p-0">SOPHIA BROWN</h4>
                    <P class="fw-bold">FOUNDER</P>
                    <h6><i class="fa-solid fa-location-dot"></i> Mumbai, Maharashtra</h6>
                </div>
                <div class="card-4-button mt-3 text-start">
                  <a href="#"><i class="fa fa-phone me-5 pe-5 ps-2"></i> Phone</a> 
                </div>
                <div class="card-4-button text-start">
                  <a href="#"><i class="fa-solid fa-envelope me-5 pe-5 ps-2"></i> Email</a> 
                </div>
                <div class="card-4-button text-start">
                  <a href="#"><i class="fa-solid fa-globe me-5 pe-5 ps-2"></i> Website</a> 
                </div>
                <div class="pt-3">
                    <a href="#"><i class="fa-brands fa-whatsapp card-4-icon"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook card-4-icon"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram card-4-icon"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter card-4-icon"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin-in card-4-icon"></i></a>
                </div>

            </div>
        </div>
    </div>
</section>

 <script>
	document.addEventListener("DOMContentLoaded", function () {
		const navbar = document.querySelector(".navbar-custom");

		window.addEventListener("scroll", function () {
			if (window.scrollY > 50) {
				navbar.classList.add("scrolled");
			} else {
				navbar.classList.remove("scrolled");
			}
		});
	});
	</script>	
	

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>    
</body>
</html>
