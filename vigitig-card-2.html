    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link href="assetes/css/style.css" rel="stylesheet">
</head>
<body>


<section>
    <div class="container card-backgrond">
        <div class="vigiting-card2-page  card-page">
            <div class="text-center">
                <div class="">
                    <img src="assetes/image/vigiting-card-2/vigiting-card-2-logo.png" class="" width="30%">
                    <h4 class="m-0 pt-1">Your business name</h4>
                    <h6>#1 Platform for digital business</h6>
                </div>
                <div class="pt-2">
                    <h4 class="fw-bold">Contact Us</h4>
                    <a href="#"><i class="fa-brands fa-whatsapp bg-success  fa-vigiting-card-2"></i></a>
                    <a href="#"><i class="fa-solid fa-phone bg-success mx-3  fa-vigiting-card-2"></i></a>
                    <a href="#"><i class="fa-solid fa-envelope bg-primary  fa-vigiting-card-2"></i></a>
                </div>
                <div class="pt-2">
                    <h4 class="fw-bold">Fallow Us</h4>
                    <a href="#"><i class="fa-brands fa-facebook-f bg-primary  fa-vigiting-card-2"></i></a>
                    <a href="#"><i class="fa-brands fa-instagram bg-danger  fa-vigiting-card-2"></i></a>
                    <a href="#"><i class="fa-brands fa-youtube bg-danger  fa-vigiting-card-2"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin-in bg-primary  fa-vigiting-card-2"></i></a>
                    <a href="#"><i class="fa-brands fa-x-twitter bg-dark fa-vigiting-card-2"></i></a>
                    <a href="#"><i class="fa-solid fa-globe bg-primary  fa-vigiting-card-2"></i></a>
                </div>
                <div class="pt-3">
                    <div class="container">
                        <h4 class="fw-bold">About Us</h4>
                        <p class="fw-bold">“[Business Name], founded by [Founder Name], delivers reliable, quality solutions.”</p>
                    </div>
                </div>
    
                <div class="text-bottom mt-3">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d120566.47420524032!2d72.96153101984102!3d19.208199971934132!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3be7b8fcfe76fd59%3A0xcf367d85f7c50283!2sThane%2C%20Maharashtra!5e0!3m2!1sen!2sin!4v1756119006081!5m2!1sen!2sin" width="100%" height="100" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>

            </div>
        </div>
    </div>
</section>

 <script>
	document.addEventListener("DOMContentLoaded", function () {
		const navbar = document.querySelector(".navbar-custom");

		window.addEventListener("scroll", function () {
			if (window.scrollY > 50) {
				navbar.classList.add("scrolled");
			} else {
				navbar.classList.remove("scrolled");
			}
		});
	});
	</script>	
	

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
