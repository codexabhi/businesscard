<html lang="en">
<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
    <link href="assetes/css/style.css" rel="stylesheet">
</head>
<body>


<section>
    <div class="container card-backgrond">
        <div class="card10-page card-page">
            <div class="card-text-align text-center">
                <div class="pt-5">
                    <img src="assetes/image/card-10/card-10-logo.png" class="img-fluid" width="50%">
                </div>
                <div class="mt-3">
                  <h2 class="fw-bold">Ankita Gupta</h2>
                  <h5 class="p-0 m-0 fw-bold">Baker</h5>
                </div>
                <div class="pt-4">
                    <a href="#"><i class="fa-brands fa-whatsapp fa-card-10"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin-in mx-3 fa-card-10"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter fa-card-10"></i></a>
                </div>
                <div class="card-10-button mt-5 text-start">
                  <a href="#"><i class="fa fa-phone me-5 pe-5 ps-2"></i> Phone</a> 
                </div>
                <div class="card-10-button text-start">
                  <a href="#"><i class="fa-solid fa-envelope me-5 pe-5 ps-2"></i> Email</a> 
                </div>
                <div class="card-10-button text-start">
                  <a href="#"><i class="fa-solid fa-globe me-5 pe-5 ps-2"></i> Website</a> 
                </div>
            </div>
        </div>
    </div>
</section>

 <script>
	document.addEventListener("DOMContentLoaded", function () {
		const navbar = document.querySelector(".navbar-custom");

		window.addEventListener("scroll", function () {
			if (window.scrollY > 50) {
				navbar.classList.add("scrolled");
			} else {
				navbar.classList.remove("scrolled");
			}
		});
	});
	</script>	
	

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
